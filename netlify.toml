# Netlify build settings for GNS Jewellers (Next.js 16, Node runtime).
# Environment variables are set in the Netlify UI — see DEPLOYMENT.md. Never commit secrets here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify secrets scanning stays ON for every real secret (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, GEMINI_API_KEY).
  # The variables below are NOT secret, and their values legitimately appear in the repo or browser bundle:
  #   NEXT_PUBLIC_*  -> inlined into the browser bundle by Next.js (public by design)
  #   R2_BUCKET      -> just the bucket name (shown in docs / .env.example)
  #   GEMINI_MODEL   -> just a model name such as gemini-2.5-flash (default value in code and docs)
  # Never add a real secret key to this list. This app does not use a Supabase service-role key.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,R2_BUCKET,GEMINI_MODEL,DB_LIMIT_MB,STORAGE_LIMIT_GB"

[[plugins]]
  package = "@netlify/plugin-nextjs"
